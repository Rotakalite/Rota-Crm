<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitim Bildirimi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; color: #334155; line-height: 1.6; }
        .container { max-width: 560px; margin: 40px auto; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 25px rgba(0,0,0,0.08); }
        .header { background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%); padding: 40px 32px; color: white; text-align: center; }
        .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.025em; margin-bottom: 4px; }
        .header p { font-size: 14px; opacity: 0.8; font-weight: 400; }
        .content { padding: 32px; }
        .greeting { font-size: 16px; font-weight: 500; color: #1e293b; margin-bottom: 24px; }
        .training-section { background: #ecfdf5; border-radius: 12px; padding: 24px; margin: 24px 0; border: 1px solid #d1fae5; }
        .section-title { font-size: 14px; font-weight: 600; color: #065f46; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #d1fae5; }
        .info-row:last-child { border-bottom: none; }
        .info-label { font-size: 14px; color: #047857; font-weight: 500; }
        .info-value { font-size: 14px; color: #064e3b; font-weight: 600; text-align: right; max-width: 60%; }
        .footer { background: #f8fafc; padding: 24px 32px; text-align: center; border-top: 1px solid #e2e8f0; }
        .company { font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 8px; }
        .contact { font-size: 12px; color: #64748b; line-height: 1.5; }
        .note { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Eğitim Bildirimi</h1>
            <p>Rota Kalite Danışmanlık</p>
        </div>
        
        <div class="content">
            <div class="greeting">Merhaba {{ client_name }},</div>
            
            <div class="training-section">
                <div class="section-title">Eğitim Detayları</div>
                
                <div class="info-row">
                    <span class="info-label">Eğitim Adı</span>
                    <span class="info-value">{{ training_name }}</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Eğitmen</span>
                    <span class="info-value">{{ trainer }}</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Eğitim Tarihi</span>
                    <span class="info-value">{{ training_date }}</span>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <div class="company">Rota Kalite Danışmanlık</div>
            <div class="contact">
                egitim@rotakalitedanismanlik.com<br>
                +90 (XXX) XXX XX XX
            </div>
            <div class="note">Bu otomatik bir bildirimdir</div>
        </div>
    </div>
</body>
</html>
